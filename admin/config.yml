# 담이농장 관리자 화면 설정 (Sveltia CMS)
# 관리자 화면에서 저장하면 아래 data 파일과 photos 폴더가 GitHub 저장소에 바로 기록되고,
# master에 기록되면 자동 배포가 카페24에 올립니다.
backend:
  name: github
  repo: soilrist/coinworld
  branch: master
  commit_messages:
    create: "관리자 화면: {{collection}} '{{slug}}' 추가"
    update: "관리자 화면: {{collection}} '{{slug}}' 수정"
    delete: "관리자 화면: {{collection}} '{{slug}}' 삭제"
    uploadMedia: "관리자 화면: 사진 '{{path}}' 올림"
    deleteMedia: "관리자 화면: 사진 '{{path}}' 삭제"

site_url: https://xn--980bp0a336bwfa.com/
display_url: https://xn--980bp0a336bwfa.com/
logo_url: ../favicon.svg

media_folder: photos
public_folder: photos

# 휴대폰 사진은 크기가 커서 올릴 때 가로·세로 1600px 이하 WebP로 줄입니다.
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  - name: site
    label: 홈페이지 정보
    format: json
    editor:
      preview: false
    files:
      - name: products
        label: 상품 · 가격 · 품절
        file: data/products.json
        fields:
          - name: lead
            label: 상품 목록 위 안내 문구
            widget: string
            required: false
            hint: "예) 가격은 택배 1상자 기준이며, 배송비는 무료입니다."
          - name: orderUrl
            label: 주문하기 버튼 주소
            widget: string
            pattern: ["^https://", "https:// 로 시작하는 주소를 넣어 주세요."]
          - name: products
            label: 상품
            label_singular: 상품
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: 상품 이름, widget: string }
              - { name: description, label: 한 줄 설명, widget: text, required: false }
              - name: options
                label: 무게 · 가격
                label_singular: 무게 · 가격
                widget: list
                summary: "{{fields.size}} · {{fields.price}}"
                fields:
                  - { name: size, label: "무게 (예: 특상중 5kg)", widget: string }
                  - { name: price, label: "가격 (예: 26,000원)", widget: string, required: false, hint: "비워 두면 '가격 문의'로 나옵니다." }
                  - { name: soldOut, label: 품절, widget: boolean, default: false, required: false }

      - name: notices
        label: 공지사항
        file: data/notices.json
        fields:
          - name: notices
            label: 공지
            label_singular: 공지
            widget: list
            required: false
            summary: "{{fields.date}} {{fields.title}}"
            hint: "공지가 하나도 없으면 홈페이지에 공지 칸이 나오지 않습니다."
            fields:
              - { name: title, label: 제목, widget: string }
              - { name: date, label: 날짜, widget: datetime, time_format: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", default: "{{now}}" }
              - { name: pinned, label: 맨 위에 고정, widget: boolean, default: false, required: false }
              - { name: body, label: 내용, widget: text, required: false, hint: "줄바꿈은 그대로 보입니다. 다른 사이트 코드나 스크립트는 붙여넣지 마세요." }

      - name: farm
        label: 연락처 · 사업자 정보 · 사진
        file: data/farm.json
        fields:
          - name: contacts
            label: 연락처
            label_singular: 연락처
            widget: list
            summary: "{{fields.label}}: {{fields.value}}"
            hint: "항목 이름에 '전화'가 들어가면 누르면 바로 전화가 걸립니다."
            fields:
              - { name: label, label: "항목 이름 (예: 대표 전화)", widget: string }
              - { name: value, label: 내용, widget: string }
          - name: business
            label: 사업자 정보 (맨 아래 작은 글씨)
            label_singular: 사업자 정보
            widget: list
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { name: label, label: 항목 이름, widget: string }
              - { name: value, label: 내용, widget: string }
          - name: photos
            label: 농장 사진
            label_singular: 사진
            widget: list
            required: false
            summary: "{{fields.caption}}"
            hint: "사진 파일 이름은 영어와 숫자로 지어 주세요 (예: harvest1.jpg). 사진이 하나도 없으면 사진 칸은 나오지 않습니다."
            fields:
              - { name: image, label: 사진, widget: image }
              - { name: caption, label: 사진 설명, widget: string, required: false }
