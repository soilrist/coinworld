  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com; media-src 'self' blob:; connect-src 'self' data: blob: https://api.github.com https://www.githubstatus.com https://unpkg.com https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">

    담이농장 관리자 화면 (Sveltia CMS)
    GitHub 토큰으로 로그인하면 상품·가격·품절, 공지사항, 연락처, 사진을 고칠 수 있습니다.
    저장하면 GitHub 저장소에 기록되고 자동으로 카페24에 올라갑니다.
    편집기 파일은 버전을 고정하고 무결성 해시(integrity)로 확인해, 내용이 바뀌면 실행되지 않습니다.
    편집기 버전을 올릴 때는 아래 주소의 버전과 integrity 값을 함께 바꿔야 합니다.
  -->
  <script src="https://unpkg.com/@sveltia/cms@0.227.2/dist/sveltia-cms.js" integrity="sha384-gCr3f3RuJYg6+sIiMAg2eO1+YeXswqgZAF7gmS1lggpTauAbv+2yFhIX8gol7JCy" crossorigin="anonymous"></script>
