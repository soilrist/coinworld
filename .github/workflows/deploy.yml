# master에 저장(푸시)되면 홈페이지 파일을 카페24 웹호스팅에 FTP로 올립니다.
# 접속 정보는 저장소 Settings → Secrets and variables → Actions 에 넣습니다.
#   CAFE24_FTP_HOST  예: 아이디.cafe24.com
#   CAFE24_FTP_USER  FTP 아이디
#   CAFE24_FTP_PASS  FTP 비밀번호
#   CAFE24_FTP_DIR   (선택) 올릴 폴더, 기본값 /www
name: 카페24에 올리기

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafe24-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 올릴 파일 모으기
        run: |
          mkdir -p _site
          cp index.html styles.css site.js farm-info.js favicon.svg _site/
          if [ -d photos ]; then
            mkdir -p _site/photos
            find photos -maxdepth 1 -type f ! -name 'README.md' -exec cp {} _site/photos/ \;
          fi
          ls -la _site

      - name: lftp 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: 카페24로 업로드
        env:
          FTP_HOST: ${{ secrets.CAFE24_FTP_HOST }}
          FTP_USER: ${{ secrets.CAFE24_FTP_USER }}
          FTP_PASS: ${{ secrets.CAFE24_FTP_PASS }}
          FTP_DIR: ${{ secrets.CAFE24_FTP_DIR }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::CAFE24_FTP_HOST / CAFE24_FTP_USER / CAFE24_FTP_PASS Secrets가 비어 있습니다."
            exit 1
          fi
          lftp -c "
            set net:max-retries 2;
            set net:timeout 30;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mirror --reverse --no-perms --verbose _site \"${FTP_DIR:-/www}\";
          "
