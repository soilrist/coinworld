# master에 저장(푸시)되면 홈페이지 파일을 카페24 웹호스팅에 SSH로 올립니다.
# 1) www를 잠그고(700) 2) 안의 예전 파일을 모두 지운 뒤 3) 새 파일을 올리고 4) 다시 엽니다(755).
# 접속 정보는 저장소 Settings → Secrets and variables → Actions 에 넣습니다.
#   CAFE24_SSH_HOST         접속 주소 (예: xn--980bp0a336bwfa.com = 담이농장.com)
#   CAFE24_SSH_USER         아이디 (damefarm1)
#   CAFE24_SSH_PASS         SSH/FTP 비밀번호 (바꾼 뒤의 새 비밀번호)
#   CAFE24_SSH_KNOWN_HOSTS  서버 확인용 키. PowerShell에서 `ssh-keyscan 주소` 결과 전체
name: 카페24에 올리기

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafe24-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 올릴 파일 모으기
        run: |
          mkdir -p _site
          cp index.html styles.css site.js farm-info.js favicon.svg robots.txt sitemap.xml _site/
          if [ -d photos ]; then
            mkdir -p _site/photos
            find photos -maxdepth 1 -type f ! -name 'README.md' -exec cp {} _site/photos/ \;
          fi
          ls -la _site

      - name: sshpass 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: 카페24로 업로드
        env:
          SSH_HOST: ${{ secrets.CAFE24_SSH_HOST }}
          SSH_USER: ${{ secrets.CAFE24_SSH_USER }}
          SSHPASS: ${{ secrets.CAFE24_SSH_PASS }}
          KNOWN_HOSTS: ${{ secrets.CAFE24_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSHPASS" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::CAFE24_SSH_HOST / CAFE24_SSH_USER / CAFE24_SSH_PASS / CAFE24_SSH_KNOWN_HOSTS Secrets가 비어 있습니다."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          tar -C _site -cf - . | sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=30 \
            "$SSH_USER@$SSH_HOST" '
              set -e
              mkdir -p ~/www
              chmod 700 ~/www
              find ~/www -mindepth 1 -delete
              tar -C ~/www -xf -
              find ~/www -type d -exec chmod 755 {} +
              find ~/www -type f -exec chmod 644 {} +
              chmod 755 ~/www
              ls -la ~/www
            '
